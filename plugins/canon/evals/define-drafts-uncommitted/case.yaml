schema_version: '1.1'
name: define-drafts-uncommitted
description: >-
  With specs.naming "branch" and specs.commitWhileDrafting false, /canon:define writes the spec
  under its branch's name and commits and pushes nothing.
tags: [define, specs, behaviour]
execution:
  prompt: /canon:define rate-limit password reset requests
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-commit-or-push
    type: tool_used
    tool: Bash
    input_match: 'git\b[^"]*\b(?:commit|push)\b'
    min: 0
    max: 0
    arm: both
  - name: no-numbered-spec
    type: file_exists
    path: docs/specs/[0-9][0-9][0-9]-*.md
    exists: false
  - name: named-after-branch
    type: llm
    weight: 2
    focus: trace
    criteria: >-
      PASS if the run wrote the spec to docs/specs/<branch>.md, the branch it cut with each / as
      -, such as docs/specs/feat-rate-limit-password-resets.md for feat/rate-limit-password-resets,
      left it uncommitted, and said the draft is on this machine only until /canon:approve. FAIL if
      it numbered the spec, committed or pushed it, or did not say the draft is unpushed.
