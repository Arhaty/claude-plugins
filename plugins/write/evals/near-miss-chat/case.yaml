schema_version: '1.1'
name: near-miss-chat
description: An explanation for the user in chat is not text for another reader.
tags: [write, trigger, negative]
execution:
  prompt: In two sentences, what's the difference between git rebase and git merge?
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:write:)?write"'
    min: 0
    max: 0
    arm: both
