schema_version: '1.1'
name: define-tracker-branch-name
description: >-
  With branches.naming set to "tracker", /canon:define cuts the branch the issue names, verbatim,
  with no prefix: the fixture's branchName differs from anything the title would give.
tags: [define, tracker, behaviour]
execution:
  prompt: /canon:define ABC-7
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: cuts-the-issue-branch
    type: tool_used
    tool: Bash
    input_match: '(?:checkout|switch)\b[^\n]*abc-7-reset-limits|branch="?abc-7-reset-limits\b'
    min: 1
    arm: with-only
  - name: no-prefixed-branch
    type: tool_used
    tool: Bash
    input_match: '(?:checkout\s+-b|switch\s+-c)\s+"?[a-z]+/abc-7'
    min: 0
    max: 0
    arm: both
  - name: names-the-branch
    type: llm
    focus: last_message
    criteria: >-
      PASS if the reply names the branch abc-7-reset-limits as the spec's branch. FAIL if it names
      a branch with a prefix such as feat/abc-7-..., or one built from the issue title.
