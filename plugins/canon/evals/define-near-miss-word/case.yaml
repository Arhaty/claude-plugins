schema_version: '1.1'
name: define-near-miss-word
description: Asking for the definition of a word is not a spec.
tags: [define, trigger, negative]
execution:
  prompt: Define "idempotent" in one sentence, in the context of HTTP retries.
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: define-not-run
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:canon:)?define"'
    min: 0
    max: 0
    arm: both
