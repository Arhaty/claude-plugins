schema_version: '1.1'
name: review-canon-paths
description: A request to check paths against docs/canon triggers review.
tags: [review, trigger]
execution:
  prompt: Does the code under src/auth follow the rules we wrote down in docs/canon?
  max_turns: 30
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
context:
  scaffold_script: scaffold.sh
graders:
  - type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:canon:)?review"'
  - type: llm
    focus: last_message
    criteria: >-
      PASS if the reply says src/auth/limit.ts allows 10 failed attempts where docs/canon/auth.md
      sets 5, and cites docs/canon/auth.md. FAIL otherwise.
