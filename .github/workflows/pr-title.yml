name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Conventional commit title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Squash merges use the pull request title as the commit subject, and release-please reads
      # those subjects to pick the version and write the changelog.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            chore
            refactor
            docs
            style
            test
            perf
          requireScope: false
          subjectPattern: ^[a-z].+[^.]$
          subjectPatternError: The subject must start lowercase and not end with a period.
