schema_version: '1.1'
name: review-near-miss-bugs
description: >-
  A correctness review of pasted code is /code-review's job, not canon's project-rules review.
tags: [review, trigger, negative]
execution:
  prompt: |-
    Review this function for bugs:

    ```js
    function average(xs) {
      return xs.reduce((a, b) => a + b) / xs.length;
    }
    ```
  max_turns: 4
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:canon:)?review"'
    min: 0
    max: 0
    arm: both
