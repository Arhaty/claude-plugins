schema_version: '1.1'
name: define-stops-at-draft
description: >-
  /canon:define writes a draft spec on a new branch and stops for the owner: it never approves,
  commits or pushes.
tags: [define, behaviour]
execution:
  prompt: /canon:define rate-limit password reset requests
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - type: file_exists
    path: docs/specs/[0-9][0-9][0-9]-*.md
  - type: tool_used
    tool: Bash
    input_match: 'git\b[^"]*\b(?:commit|push)\b'
    min: 0
    max: 0
    arm: both
  - type: llm
    weight: 2
    focus: trace
    criteria: >-
      PASS if the run wrote a new spec under docs/specs/ whose status line is `**Status:** draft`,
      and never set the status to approved, in-progress or shipped. FAIL if any spec was written
      with another status, or the run claims the spec is approved.
  - type: llm
    weight: 2
    focus: last_message
    criteria: >-
      PASS if the final message stops for the owner: it either asks the open questions the spec
      still has, or says the spec is a draft and /canon:approve is the next step. FAIL if it says
      the work is approved, starts building, or presents the spec as final without the owner.
