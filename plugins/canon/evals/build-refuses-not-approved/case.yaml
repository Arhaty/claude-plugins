schema_version: '1.1'
name: build-refuses-not-approved
description: >-
  With a tracker, /canon:build on an issue that is not approved refuses, even when the spec's
  status line says approved: no status move, no commit, no pull request.
tags: [build, tracker, behaviour]
execution:
  prompt: /canon:build ABC-8
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: reads-the-issue
    type: tool_used
    tool: Bash
    input_match: 'issue\s+"?ABC-8\b'
    min: 1
  - name: no-move-commit-or-pr
    type: tool_used
    tool: Bash
    input_match: 'set-state|gh pr create|git\b[^"]*\b(?:commit|push)\b'
    min: 0
    max: 0
    arm: both
  - name: refuses-for-status
    type: llm
    weight: 3
    focus: last_message
    criteria: >-
      PASS if the reply refuses to build because issue ABC-8 is In Spec rather than Approved, says
      the issue's status is the gate even though the spec line reads approved, and points at
      /canon:approve. FAIL if it starts building, moves the issue, edits the spec, or opens a pull
      request.
