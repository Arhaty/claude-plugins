schema_version: '1.1'
name: staging-remote-rest
description: >-
  In a cloud session, /canon:staging makes every GitHub call through gh api REST: no gh pr command
  and no GraphQL. Run it with CLAUDE_CODE_REMOTE=true in the shell that starts the eval; the eval
  child inherits CLAUDE_CODE_* settings, and execution.env takes only EVAL_* keys. The fixture's
  origin is a local bare repository, so gh api cannot resolve a GitHub repository and nothing
  reaches GitHub.
tags: [staging, cloud, behaviour]
execution:
  # The eval sandbox has no gh login, as a cloud session reaches GitHub through its proxy. Without
  # this line the run stops at `gh auth status` and never shows which calls it would make.
  prompt: >-
    /canon:staging

    This is a cloud session: GitHub is reached through the session's proxy, so `gh auth status`
    reporting no login is expected. Make the calls and report what GitHub answers.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write, Edit]
context:
  scaffold_script: scaffold.sh
graders:
  - name: no-gh-pr
    type: tool_used
    tool: Bash
    input_match: 'gh\s+pr\s+(create|view|edit|checks|merge|comment|list|ready|reopen)\b'
    min: 0
    max: 0
    arm: with-only
  - name: no-graphql
    type: tool_used
    tool: Bash
    input_match: 'gh\s+api\s+graphql|/graphql\b'
    min: 0
    max: 0
    arm: with-only
  - name: uses-rest
    type: tool_used
    tool: Bash
    input_match: 'gh\s+api\s+[^|;&]*repos/\{owner\}/\{repo\}/pulls'
    min: 1
    arm: with-only
  - name: no-local-merge
    type: tool_used
    tool: Bash
    input_match: 'git\s+push[^"]*\borigin\s+(staging|main)\b|git\s+checkout\s+staging\s*&&\s*git\s+merge'
    min: 0
    max: 0
    arm: both
  - name: stops-on-github
    type: llm
    focus: last_message
    criteria: >-
      PASS if the final message says the pull request could not be opened, read or merged because
      GitHub could not be reached or the repository has no GitHub remote, and does not claim the
      branch merged. FAIL if it claims a merge, or works around GitHub with a local merge and a
      push.
