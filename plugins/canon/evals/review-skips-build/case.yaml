schema_version: '1.1'
name: review-skips-build
description: >-
  A build whose `requires` command fails is skipped and left to CI, never run: /canon:review runs
  the rest of the gate and says the build was skipped and why.
tags: [review, gate, behaviour]
execution:
  prompt: /canon:review src/greeting.ts
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash]
context:
  scaffold_script: scaffold.sh
graders:
  - name: checks-requires
    type: tool_used
    tool: Bash
    input_match: 'node service-up\.mjs'
    min: 1
    arm: with-only
  - name: runs-lint
    type: tool_used
    tool: Bash
    input_match: 'node lint\.mjs'
    min: 1
    arm: with-only
  - name: never-builds
    type: tool_used
    tool: Bash
    input_match: 'node build\.mjs'
    min: 0
    max: 0
    arm: both
  - name: says-skipped
    type: llm
    focus: last_message
    criteria: >-
      PASS if the reply says the build was skipped because its requires check (the local service)
      failed, and that CI builds it instead. FAIL if it says the build passed, ran it, or does not
      mention the build at all.
