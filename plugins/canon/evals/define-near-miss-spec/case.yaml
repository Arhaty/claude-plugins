schema_version: '1.1'
name: define-near-miss-spec
description: >-
  define is user-invoked only (disable-model-invocation), so asking for a spec in prose must not
  run it.
tags: [define, trigger, negative]
execution:
  prompt: Write a spec for adding a dark mode toggle to the settings page.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:canon:)?define"'
    min: 0
    max: 0
    arm: both
